name: Build and publish BUSHRA APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bushra-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore personal development signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bushra-debug.keystore
          key: bushra-personal-development-signing-v2
      - name: Prepare development signing key
        env:
          BUSHRA_DEBUG_STORE: ${{ runner.temp }}/bushra-debug.keystore
        run: |
          if [ ! -f "$BUSHRA_DEBUG_STORE" ]; then
            keytool -genkeypair -keystore "$BUSHRA_DEBUG_STORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Compile, test and lint
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUSHRA_DEBUG_STORE: ${{ runner.temp }}/bushra-debug.keystore
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare installable preview
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BUSHRA-AI.apk
          cd dist
          sha256sum BUSHRA-AI.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BUSHRA-installable-APK
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  ui-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke test and captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest
            mkdir -p ui-captures
            adb exec-out run-as dev.rakib.bushra tar -C files/ui-captures -cf - . > ui-captures/screens.tar
            tar -xf ui-captures/screens.tar -C ui-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-captures
          path: |
            ui-captures/*.png
            app/build/reports/androidTests/
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK with bounded retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in 1 2 3; do
            if timeout 120s gh run download "$RUN_ID" --name BUSHRA-installable-APK --dir dist; then
              break
            fi
          done
          test -f dist/BUSHRA-AI.apk
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "preview-${RUN_NUMBER}" dist/* --target "$COMMIT_SHA" --prerelease --title "BUSHRA AI 0.4.0 - installable preview ${RUN_NUMBER}" --notes 'BUSHRA AI 0.4.0: fixes compound Bengali commands accidentally treated as contact names; suppresses null/stale canceled replies and premature action claims. Stable voice removes parallel system ASR and silence restart loops; local VAD waits for speech, optional hardware-dependent interruption. Selected-contact timed SMS/WhatsApp auto-chat with explicit rules, limits, Stop, channel isolation, dedup and no resend after failures. WhatsApp replies use its exact notification RemoteInput action; no full chat database access. Requires owner-granted SMS/notification permissions, provider quota and Android background scheduling. CI does not send real messages; physical TECNO acceptance testing remains necessary.'
